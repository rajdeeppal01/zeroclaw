version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: threat-hub-nginx
    ports:
      - "443:443"
      - "8443:8443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/scripts:/etc/nginx/scripts:ro
      # STRICT VOLUME MOUNTS: Only mount the necessary public/chain certs and CRL. 
      # Never mount the intermediate-ca.key or root-ca.key into this container.
      - ./pki/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./pki/certs/server.key:/etc/nginx/certs/server.key:ro
      - ./pki/certs/ca-chain.crt:/etc/nginx/certs/ca-chain.crt:ro
      - ./pki/crl/ca-chain.crl:/etc/nginx/crl/ca-chain.crl:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - hub_internal
    depends_on:
      - api

  crl-updater:
    image: alpine:3.19
    container_name: threat-hub-crl-updater
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./pki/renew_crl.sh:/pki/renew_crl.sh:ro
      - ./pki/certs/intermediate-ca.key:/pki/certs/intermediate-ca.key:ro
      - ./pki/certs/intermediate-ca.crt:/pki/certs/intermediate-ca.crt:ro
      - ./pki/ca_db_inter:/pki/ca_db_inter:rw
      - ./pki/crl:/pki/crl:rw
    # Run the renewal script every 7 days (604800 seconds) to ensure the 30-day Intermediate CRL never expires.
    # If the script fails, the loop exits non-zero, crashing the container and triggering the restart policy.
    command: /bin/sh -c "apk add --no-cache openssl coreutils && while true; do sh /pki/renew_crl.sh || exit 1; sleep 604800; done"
    networks:
      - hub_internal

  api:
    build: ./api
    container_name: threat-hub-api
    # HEADER SPOOFING MITIGATION: 
    # Do NOT add a `ports: - "3000:3000"` mapping here. 
    # The API must remain isolated on the hub_internal network. If exposed to the host, 
    # attackers can bypass Nginx and manually inject X-Client-Cert-CN headers.
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://zeroclaw:zeroclaw_super_secret@postgres:5432/zeroclaw?schema=public&connection_limit=50&pool_timeout=10
      - JWT_SECRET=super_secret_jwt_key_change_in_prod
      - ANOMALY_THRESHOLD=20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hub_internal
  postgres:
    image: postgres:15-alpine
    container_name: threat-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeroclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroclaw}
      POSTGRES_DB: ${POSTGRES_DB:-zeroclaw}
    ports:
      - "5434:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hub_internal

networks:
  hub_internal:
    driver: bridge
    internal: false # Needs to be false so API can reach out, but we don't map ports to the host for the API.

volumes:
  postgres_data:
