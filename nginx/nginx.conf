events {
    worker_connections 1024;
}

http {
    # Include MIME types so CSS/JS load correctly
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Extract the CN from the full Distinguished Name
    map $ssl_client_s_dn $ssl_client_s_dn_cn {
        default "";
        ~CN=(?<CN>[^,/\s]+) $CN;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    # Rate Limiting Zone for Public Onboarding Endpoints
    limit_req_zone $binary_remote_addr zone=public_onboard:10m rate=2r/s;

    # ==========================================
    # PUBLIC VHOST & AGENT INGESTION (Port 443)
    # ==========================================
    server {
        listen 443 ssl;
        server_name localhost;

        # Server Certificate
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Client Certificate Verification (mTLS)
        ssl_client_certificate /etc/nginx/certs/ca-chain.crt;
        ssl_verify_client optional; # Changed to optional for public carve-out
        ssl_verify_depth 2;

        # CRL (Certificate Revocation List)
        ssl_crl /etc/nginx/crl/ca-chain.crl;

        # TLS Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /api/v1/threats {
            if ($ssl_client_verify != SUCCESS) {
                return 403 "Forbidden: Invalid or Revoked Client Certificate";
            }
            proxy_pass http://api:3000;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/feed {
            if ($ssl_client_verify != SUCCESS) {
                return 403 "Forbidden: Invalid or Revoked Client Certificate";
            }
            proxy_pass http://api:3000;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # =======================================
        # PUBLIC ONBOARDING CARVE-OUT (No mTLS check)
        # =======================================
        location /api/v1/public/ {
            limit_req zone=public_onboard burst=5 nodelay;
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Block anything else on this port that isn't explicitly defined
        location / {
            return 404;
        }
    }

    # ==========================================
    # ANALYST CONTROL PLANE & UI (Port 8443)
    # Standard HTTPS (No client certs)
    # ==========================================
    server {
        listen 8443 ssl;
        server_name localhost;

        # Server Certificate (same as above)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Backend API Auth/UI routes
        location /api/v1/auth/ {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ui/ {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/public/ {
            limit_req zone=public_onboard burst=5 nodelay;
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend UI (Serve static Vite build)
        location / {
            root /etc/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
